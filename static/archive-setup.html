<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MIGA Archive Server Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --accent:#0d6efd; --border:#dbe3ec; --surface:#fff; --bg:#f4f6f9; --text:#263244; --muted:#596579; }
        body { margin:0; min-height:100dvh; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,sans-serif; }
        main { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:48px 0; }
        .setup-panel { background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 30px rgba(37,56,88,.08); }
        .setup-header,.setup-body { padding:24px; } .setup-header { border-bottom:1px solid var(--border); }
        .status-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
        .status-item { border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
        .status-item span { display:block; color:var(--muted); font-size:.78rem; } .status-item strong { overflow-wrap:anywhere; }
        @media(max-width:600px){ main{padding:20px 0}.status-grid{grid-template-columns:1fr}.setup-header,.setup-body{padding:18px} }
    </style>
</head>
<body><main><section class="setup-panel">
    <header class="setup-header"><h1 class="h4 mb-2">MIGA Archive Server</h1><p class="text-muted mb-0">Choose an existing NAS mount. Inspection is read-only until you confirm initialization.</p></header>
    <div class="setup-body">
        <label class="form-label fw-bold" for="archive-root">Archive root</label>
        <input id="archive-root" class="form-control" value="/mnt/miga-archive" aria-describedby="root-help">
        <div id="root-help" class="form-text">AFP/GVFS paths can be tested, but NFS is recommended for the permanent service.</div>
        <div class="d-flex gap-2 mt-3"><button id="inspect" class="btn btn-outline-primary">Inspect path</button><button id="initialize" class="btn btn-primary" disabled>Initialize</button></div>
        <div id="message" class="alert mt-3 d-none" role="status"></div>
        <div id="result" class="status-grid mt-3 d-none"></div>
    </div>
</section></main>
<template id="device-template"><section class="setup-panel mt-4"><header class="setup-header"><h2 class="h5 mb-2">Register a controller</h2><p class="text-muted mb-0">The Archive Server will pull completed runs from this Linux host.</p></header><div class="setup-body">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label" for="device-id">Device ID</label><input id="device-id" class="form-control" placeholder="master"></div>
        <div class="col-md-6"><label class="form-label" for="device-name">Display name</label><input id="device-name" class="form-control" placeholder="MIGA Master"></div>
        <div class="col-md-6"><label class="form-label" for="device-role">Role</label><select id="device-role" class="form-select"><option value="master">Master</option><option value="slave">Slave</option><option value="standalone">Standalone</option></select></div>
        <div class="col-md-6"><label class="form-label" for="device-host">IP or host</label><input id="device-host" class="form-control" placeholder="192.168.1.20"></div>
        <div class="col-md-6"><label class="form-label" for="device-user">SSH user</label><input id="device-user" class="form-control" placeholder="miga"></div>
        <div class="col-md-6"><label class="form-label" for="device-path">Data_log path</label><input id="device-path" class="form-control" placeholder="/home/miga/MIGA-controller/Data_log"></div>
    </div>
    <button id="register-device" class="btn btn-primary mt-3">Register device</button><div id="device-message" class="alert mt-3 d-none" role="status"></div>
</div></section></template>
<script>
const pathInput=document.getElementById('archive-root'),inspectButton=document.getElementById('inspect'),initializeButton=document.getElementById('initialize'),message=document.getElementById('message'),result=document.getElementById('result');
function showMessage(text,type='info'){message.textContent=text;message.className=`alert alert-${type} mt-3`;}
function bytes(value){if(value==null)return 'Unknown';let size=Number(value),unit=0,units=['B','KB','MB','GB','TB'];while(size>=1024&&unit<units.length-1){size/=1024;unit++}return `${size.toFixed(unit?1:0)} ${units[unit]}`}
async function request(endpoint){const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:pathInput.value})});const payload=await response.json();if(!response.ok)throw new Error(payload.detail||'Request failed');return payload}
inspectButton.onclick=async()=>{initializeButton.disabled=true;showMessage('Inspecting path...');try{const data=await request('/archive-server/setup/inspect');result.innerHTML=[['Exists',data.exists?'Yes':'No'],['Readable',data.readable?'Yes':'No'],['Writable',data.writable?'Yes':'No'],['Filesystem',data.filesystem||'Unknown'],['Mount point',data.mountpoint||'Unknown'],['Free space',bytes(data.free_bytes)]].map(([label,value])=>`<div class="status-item"><span>${label}</span><strong>${value}</strong></div>`).join('');result.classList.remove('d-none');showMessage(data.warnings.length?data.warnings.join(' '):'Path checks passed.',data.warnings.length?'warning':'success');initializeButton.disabled=!(data.exists&&data.readable&&data.writable)}catch(error){showMessage(error.message,'danger')}};
function showDeviceForm(){if(document.getElementById('register-device'))return;document.querySelector('main').append(document.getElementById('device-template').content.cloneNode(true));document.getElementById('register-device').onclick=registerDevice}
async function registerDevice(){const button=document.getElementById('register-device'),notice=document.getElementById('device-message');button.disabled=true;notice.textContent='Registering device...';notice.className='alert alert-info mt-3';const body={device_id:document.getElementById('device-id').value,name:document.getElementById('device-name').value,role:document.getElementById('device-role').value,transport:'ssh',host:document.getElementById('device-host').value,ssh_user:document.getElementById('device-user').value,source_path:document.getElementById('device-path').value};try{const response=await fetch('/archive-server/devices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),payload=await response.json();if(!response.ok)throw new Error(payload.detail||'Registration failed');notice.textContent=`${payload.name} registered. SSH connection testing and backup scheduling are the next setup step.`;notice.className='alert alert-success mt-3'}catch(error){notice.textContent=error.message;notice.className='alert alert-danger mt-3'}finally{button.disabled=false}}
initializeButton.onclick=async()=>{initializeButton.disabled=true;showMessage('Initializing archive directories...');try{const data=await request('/archive-server/setup/initialize');showMessage(`Archive ${data.archive_uuid} initialized. Register Master and Slave below.`,'success');showDeviceForm()}catch(error){showMessage(error.message,'danger');initializeButton.disabled=false}};
fetch('/archive-server/status').then(response=>response.json()).then(data=>{if(data.configured){pathInput.value=data.configuration.archive_root;showMessage('Archive root is already initialized. You can register or update devices below.','success');showDeviceForm()}}).catch(()=>{});
</script></body></html>
